<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hisn Lifestyle Help & Support</title>

<link rel="preconnect" href="https://mrisllc.github.io" crossorigin>
<link rel="dns-prefetch" href="https://mrisllc.github.io">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
html,body{height:100%;overflow:hidden;background:#f8f9fa}
.top-bar{display:flex;justify-content:space-between;align-items:center;height:56px;padding:0 16px;background:#fff;border-bottom:1px solid #e5e7eb}
.help-support-title{font-size:17px;font-weight:600;color:#1f2937}
.lang-select-container select{padding:6px 10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;outline:none}
.category-scroll-container{display:flex;gap:10px;overflow-x:auto;padding:10px 14px;background:#fff;border-bottom:1px solid #e5e7eb;scrollbar-width:none}
.category-scroll-container::-webkit-scrollbar{display:none}
.cat-btn{padding:8px 16px;border:1px solid #d1d5db;border-radius:999px;background:#f3f4f6;color:#374151;white-space:nowrap;cursor:pointer}
.cat-btn.active{background:#2563eb;color:#fff;border-color:#2563eb}
.content-area{position:relative;height:calc(100vh - 112px);background:#fff}
iframe{width:100%;height:100%;border:none}
.loading-overlay{position:absolute;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;z-index:5;transition:.25s}
.loading-overlay.hidden{opacity:0;pointer-events:none}
.spinner{width:34px;height:34px;border:3px solid #e5e7eb;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="top-bar">
  <div class="help-support-title" id="topTitle">Help & Support</div>
  <div class="lang-select-container">
    <select id="languageSelect" onchange="changeLanguage()">
      <option value="en">English</option>
      <option value="bn">বাংলা</option>
    </select>
  </div>
</div>

<div class="category-scroll-container">
  <button class="cat-btn active" data-key="terms"
    data-url="https://mrisllc.github.io/Islamic-apps-page-/terms-of-service.html">Terms of Service</button>

  <button class="cat-btn" data-key="privacy"
    data-url="https://mrisllc.github.io/Islamic-apps-page-/privacy-policy.html">Privacy Policy</button>

  <button class="cat-btn" data-key="faq"
    data-url="https://mrisllc.github.io/Islamic-apps-page-/faq.html">FAQ</button>

  <button class="cat-btn" data-key="report"
    data-url="https://mrisllc.github.io/Islamic-apps-page-/report-problem.html">Report a Problem</button>

  <button class="cat-btn" data-key="articles"
    data-url="https://mrisllc.github.io/Islamic-apps-page-/articles/">Articles</button>
</div>

<div class="content-area">
  <div class="loading-overlay" id="loading">
    <div class="spinner"></div>
  </div>

  <iframe id="contentFrame"
    src="https://mrisllc.github.io/Islamic-apps-page-/terms-of-service.html"
    loading="eager"
    title="Hisn Lifestyle Content"></iframe>
</div>

<script>
const translations={
en:{topTitle:"Help & Support",terms:"Terms of Service",privacy:"Privacy Policy",faq:"FAQ",report:"Report a Problem",articles:"Articles"},
bn:{topTitle:"সহায়তা ও সহযোগিতা",terms:"সেবার শর্তাবলী",privacy:"গোপনীয়তা নীতি",faq:"সাধারণ জিজ্ঞাসা",report:"সমস্যা রিপোর্ট",articles:"আর্টিকেল"}
};

const iframe=document.getElementById("contentFrame");
const loading=document.getElementById("loading");

document.querySelectorAll(".cat-btn").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".cat-btn").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
loading.classList.remove("hidden");
iframe.src=btn.dataset.url;
};
});

iframe.onload=()=>loading.classList.add("hidden");
iframe.onerror=()=>loading.classList.add("hidden");

function changeLanguage(){
const lang=document.getElementById("languageSelect").value;
document.getElementById("topTitle").textContent=translations[lang].topTitle;
document.querySelectorAll(".cat-btn").forEach(btn=>{
btn.textContent=translations[lang][btn.dataset.key];
});
}
</script>

</body>
</html>
